<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Painéis · Negócios Creators</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,800&display=swap">
<style>
  :root { --bg: #F3EBDF; --card: #FBF7F1; --line: #E2D5C3; --ink: #5A3A2E; --muted: #8A6E60; --mint: #C8603A; --orange: #C99A2E; --salvia: #9CAF88; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: "Bricolage Grotesque", system-ui, sans-serif; padding: max(32px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 22px; }
  header img { height: 64px; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 14px 0 4px; } p { color: var(--muted); margin: 0; }
  .list { display: grid; gap: 10px; }
  .app { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); color: var(--ink); text-decoration: none; }
  .app:hover { border-color: var(--mint); }
  .av { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; color: #F3EBDF; background: var(--mint); flex: none; }
  .app:nth-child(3n+2) .av { background: #5A3A2E; } .app:nth-child(3n) .av { background: var(--salvia); color: #5A3A2E; }
  .app b { display: block; } .app small { color: var(--muted); font-size: 12px; }
  footer { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <main>
    <header>

      <h1>Painéis</h1>
      <p>Áreas com login da Negócios Creators.</p>
    </header>
    <nav class="list">
<!--LISTA-->
    </nav>
    <footer>Cada painel pede o próprio login. Site público: <a href="https://negocioscreators.com/" style="color:var(--mint)">negocioscreators.com</a></footer>
  </main>
</body>
</html>

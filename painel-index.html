<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painéis · Negócios Creators</title>
<link rel="icon" href="https://negocioscreators.com/marca/nc-icone-32.png">
<link rel="apple-touch-icon" href="https://negocioscreators.com/marca/nc-icone-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&display=swap">
<style>
  :root { --bg: #0F1013; --card: #1B1D22; --line: #30333A; --ink: #F2F3EE; --muted: #A8ACA4; --mint: #3EDDB0; --orange: #FF8F4A; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(60% 50% at 100% 100%, rgba(255,143,74,.14), transparent), radial-gradient(50% 40% at 0 0, rgba(62,221,176,.08), transparent), var(--bg); color: var(--ink); font-family: Manrope, system-ui, sans-serif; padding: max(32px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 22px; }
  header img { height: 34px; }
  h1 { font-size: 26px; font-weight: 800; margin: 14px 0 4px; } p { color: var(--muted); margin: 0; }
  .list { display: grid; gap: 10px; }
  .app { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); color: var(--ink); text-decoration: none; }
  .app:hover { border-color: var(--mint); }
  .av { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; color: #0F1013; background: var(--mint); flex: none; }
  .app:nth-child(even) .av { background: var(--orange); }
  .app b { display: block; } .app small { color: var(--muted); font-size: 12px; }
  footer { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <main>
    <header>
      <img src="https://negocioscreators.com/marca/nc-marca-clara.svg" alt="nc">
      <h1>Painéis</h1>
      <p>Áreas com login da Negócios Creators.</p>
    </header>
    <nav class="list">
<!--LISTA-->
    </nav>
    <footer>Cada painel pede o próprio login. Site público: <a href="https://negocioscreators.com/" style="color:var(--mint)">negocioscreators.com</a></footer>
  </main>
</body>
</html>

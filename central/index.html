<html lang="pt-BR">
<head>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Central Negócios Creators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: app — trilho escuro da marca à esquerda (logo + clientes), barra de áreas no topo, miolo em cards. No celular: clientes viram chips no topo e as áreas viram barra de abas embaixo. */
:root {
  --bg: #F5F5F1;
  --surface: #FFFFFF;
  --surface-2: #EEEEE6;
  --ink: #15171A;
  --muted: #5A5E57;
  --line: #E4E4DC;
  --mint: #14A37E;
  --orange: #D9692A;
  --on-mint: #FFFFFF;
  --ok: #14A37E;
  --warn: #C98A12;
  --bad: #D93D3D;
  --na: #A3A69E;
  --ok-soft: #E3F5EE;
  --warn-soft: #FBF1DC;
  --bad-soft: #FBE7E6;
  --shadow: 0 1px 2px rgba(21, 23, 26, .05), 0 4px 16px rgba(21, 23, 26, .05);
  --rail: #16171B;
  --rail-2: #25272D;
  --rail-ink: #F2F3EE;
  --rail-muted: #A8ACA4;
  --brand-mint: #3EDDB0;
  --brand-orange: #FF8F4A;
  --brand-cream: #FFF3E6;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1013; --surface: #1B1D22; --surface-2: #25272D; --ink: #F2F3EE; --muted: #A8ACA4; --line: #30333A;
    --mint: #3EDDB0; --orange: #FF8F4A; --on-mint: #0F1013; --ok: #3EDDB0; --warn: #F5B83D; --bad: #FF6B6B; --na: #6B6F68;
    --ok-soft: #153029; --warn-soft: #33290F; --bad-soft: #3A1B1B; --shadow: none; --rail: #0A0B0D; --rail-2: #1E2025; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1013; --surface: #1B1D22; --surface-2: #25272D; --ink: #F2F3EE; --muted: #A8ACA4; --line: #30333A;
  --mint: #3EDDB0; --orange: #FF8F4A; --on-mint: #0F1013; --ok: #3EDDB0; --warn: #F5B83D; --bad: #FF6B6B; --na: #6B6F68;
  --ok-soft: #153029; --warn-soft: #33290F; --bad-soft: #3A1B1B; --shadow: none; --rail: #0A0B0D; --rail-2: #1E2025; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 800; letter-spacing: -0.01em; }
h1 { font-size: clamp(24px, 3vw, 30px); }
h2 { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
h3 { font-size: 19px; }
h4 { font-size: 17px; }
a { color: var(--mint); font-weight: 700; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* App shell */
.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.rail { background: var(--rail); color: var(--rail-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 20px 14px calc(16px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
.logo { display: flex; align-items: center; gap: 12px; padding: 4px 8px 6px; }
.logo svg { height: 26px; width: auto; }
.logo small { display: block; color: var(--rail-muted); font-size: 12px; font-weight: 600; }
.rail h2 { color: var(--rail-muted); padding: 0 10px; }
.clients { display: grid; gap: 2px; }
.cbtn { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; text-align: left; border: 0; background: none; color: var(--rail-ink); border-radius: 10px; padding: 7px 10px; font-size: 14px; font-weight: 600; }
.cbtn:hover { background: var(--rail-2); }
.cbtn[aria-current="true"] { background: var(--rail-2); box-shadow: inset 3px 0 0 var(--brand-mint); }
.cbtn small { display: block; font-size: 11px; color: var(--rail-muted); font-weight: 500; }
.av { position: relative; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #15171A; }
.av svg.i { width: 18px; height: 18px; color: var(--rail-ink); }
.av .st { position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--rail); background: var(--na); }
.av .st.s-ok { background: var(--brand-mint); } .av .st.s-warn { background: #F5B83D; } .av .st.s-bad { background: #FF6B6B; } .av .st.s-none { display: none; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--brand-orange); color: #15171A; font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.rail .addrow input { background: var(--rail-2); border-color: transparent; color: var(--rail-ink); }
.rail .addrow .btn { background: var(--rail-2); color: var(--rail-ink); border-color: transparent; }
.rail-foot { margin-top: auto; padding: 0 10px; color: var(--rail-muted); font-size: 12px; }

.content { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: calc(12px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 12px 24px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
nav.areas { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow-x: auto; max-width: 100%; }
nav.areas button { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--muted); border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 14px; white-space: nowrap; }
nav.areas button:hover { color: var(--ink); background: var(--surface-2); }
nav.areas button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.goal { display: grid; gap: 5px; min-width: 260px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow); }
.goal .line { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); font-weight: 600; }
.goal .line b { color: var(--ink); font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 14px; }
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--brand-mint), var(--brand-orange)); }

main { padding: 24px max(24px, env(safe-area-inset-right, 0px)) 56px 24px; display: grid; gap: 26px; min-width: 0; max-width: 1240px; width: 100%; }
.mhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 16px; }
.ptitle { display: grid; gap: 2px; }
.ptitle .crumb { font-size: 13px; font-weight: 700; color: var(--muted); }
.block { display: grid; gap: 12px; }
.notice { margin: 16px 24px 0; padding: 12px 14px; border-radius: 12px; background: var(--warn-soft); border: 1px solid var(--warn); font-size: 14px; }

/* Mobile */
.mclients { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .rail { display: none; }
  .topbar .mtop { display: flex; }
  .topbar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .mclients { display: flex; gap: 6px; overflow-x: auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); margin-top: 12px; }
  .mclients .cbtn { background: var(--surface); color: var(--ink); border: 1px solid var(--line); grid-template-columns: 26px auto auto; white-space: nowrap; padding: 5px 10px 5px 6px; border-radius: 999px; }
  .mclients .cbtn[aria-current="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
  .mclients .cbtn small { display: none; }
  .mclients .av { width: 26px; height: 26px; font-size: 11px; }
  .mclients .av .st { border-color: var(--surface); }
  .goal { width: 100%; min-width: 0; }
  nav.areas { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; border-radius: 0; border-width: 1px 0 0; justify-content: space-around; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  nav.areas button { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 6px; flex: 1; }
  nav.areas button[aria-selected="true"] { background: none; color: var(--mint); }
  main { padding: 18px max(16px, env(safe-area-inset-right, 0px)) 110px max(16px, env(safe-area-inset-left, 0px)); }
  .notice { margin: 12px 16px 0; }
}
.mtop { display: none; align-items: center; gap: 10px; width: 100%; }
.mtop svg { height: 22px; width: 69px; }
.logo svg { width: 78px; }
.rgoal { background: var(--rail-2); border: 0; box-shadow: none; min-width: 0; }
.rgoal .line { color: var(--rail-muted); }
.rgoal .line b { color: var(--rail-ink); }
.rgoal .bar { background: #3A3D45; }
.mgoal { display: none; }
@media (max-width: 860px) { .mgoal { display: grid; } }
.mtop b { font-size: 16px; }

/* Peças */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: var(--surface-2); white-space: nowrap; }
.chip.s-ok { background: var(--ok-soft); color: var(--ok); } .chip.s-warn { background: var(--warn-soft); color: var(--warn); } .chip.s-bad { background: var(--bad-soft); color: var(--bad); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--na); display: inline-block; }
.s-ok .dot, .dot.s-ok { background: var(--ok); } .s-warn .dot, .dot.s-warn { background: var(--warn); } .s-bad .dot, .dot.s-bad { background: var(--bad); }
.dot.s-none { background: transparent; }
.theme { padding: 14px 18px; border-radius: 14px; background: linear-gradient(110deg, color-mix(in srgb, var(--brand-mint) 18%, var(--surface)), color-mix(in srgb, var(--brand-orange) 18%, var(--surface))); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.theme span { font-size: 13px; font-weight: 700; color: var(--muted); }
.theme b { font-size: 20px; font-weight: 800; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 14px; font-size: 14px; font-weight: 700; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--mint); color: var(--on-mint); border-color: var(--mint); }
.btn.primary:hover { filter: brightness(1.05); }
.btn:disabled { opacity: 0.5; cursor: default; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--mint); font-size: 14px; font-weight: 700; }
.linkbtn:hover { text-decoration: underline; }
.empty { padding: 18px; border: 1.5px dashed var(--line); border-radius: 14px; color: var(--muted); }
.x { background: none; border: 0; color: var(--muted); font-size: 16px; line-height: 1; padding: 2px 4px; }
.addrow { display: flex; gap: 6px; }
.addrow input, .field input, .field select, input.cell { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 7px 10px; font-size: 14px; }
textarea { width: 100%; min-height: 70px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 9px 11px; font-size: 14px; }
.saved { font-size: 12px; color: var(--ok); font-weight: 700; min-height: 1em; }
.scroll { overflow-x: auto; }
.sugg { font-size: 13px; color: var(--muted); }
.label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.label small { text-transform: none; letter-spacing: 0; font-weight: 500; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--surface-2); border-radius: 10px; width: fit-content; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 5px 12px; font-weight: 700; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* Tabelas */
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; }
table.t th, table.t td { border-top: 1px solid var(--line); padding: 10px 14px; text-align: left; vertical-align: middle; }
table.t thead th { border-top: 0; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--surface-2); }
table.t td.n, table.t th.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tfoot td { font-weight: 800; background: var(--surface-2); }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--bg); }
table.t input.cell { width: 110px; text-align: right; font-family: var(--font-mono); flex: none; }
.sub { font-size: 12px; color: var(--muted); display: block; font-weight: 500; }
.pbar { display: inline-flex; align-items: center; gap: 8px; }
.pbar .bar { width: 64px; height: 6px; }
.pbar .bar span { background: var(--mint); }

/* Pendências */
.pend-list { display: grid; gap: 10px; }
.pitem { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.pitem::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--bad); }
@media (max-width: 560px) { .pitem { grid-template-columns: 1fr; } }
.pitem.done { opacity: 0.65; } .pitem.done::before { background: var(--ok); }
.pitem .who { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.pitem .t { font-weight: 800; }
.pitem .d { color: var(--muted); font-size: 14px; }
.age { font-family: var(--font-mono); font-size: 12px; color: var(--bad); font-weight: 600; }
.pitem.done .age { color: var(--ok); }

/* Cards de sinais */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); display: grid; min-width: 0; overflow: hidden; }
.card > section { padding: 16px 18px; border-top: 1px solid var(--line); display: grid; gap: 10px; min-width: 0; }
.card > section:first-child { border-top: 0; }
.card.worst-bad { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.ctop { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.acc { font-size: 12px; color: var(--muted); }
.signals { display: grid; gap: 7px; }
.sig { display: grid; grid-template-columns: 9px 84px 1fr; gap: 10px; align-items: baseline; font-size: 14px; }
.sig .k { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.num { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.num .k { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.num .v { font-family: var(--font-mono); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }
.check { display: grid; gap: 6px; }
.citem { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; font-size: 14px; font-weight: 600; padding: 6px 8px; border-radius: 8px; }
.citem:hover { background: var(--surface-2); }
.citem input { margin-top: 3px; accent-color: var(--mint); width: 17px; height: 17px; }
.citem.on span { text-decoration: line-through; color: var(--muted); font-weight: 500; }
.citem .x { visibility: hidden; }
.citem:hover .x, .citem .x:focus-visible { visibility: visible; }
details summary { cursor: pointer; list-style: none; }
details summary::-webkit-details-marker { display: none; }
details summary .label::after { content: "▸"; }
details[open] summary .label::after { content: "▾"; }

/* Blocos de etapas */
.steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.sblock { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.sblock.full { border-color: color-mix(in srgb, var(--ok) 60%, var(--line)); }
.sblock .bh { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sblock .meta { font-size: 13px; color: var(--muted); font-weight: 600; }
.sblock .foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.ring { --p: 0; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--mint) calc(var(--p) * 1%), var(--surface-2) 0); flex: none; }
.ring span { width: 30px; height: 30px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
.cell-s { font-family: var(--font-mono); font-size: 13px; }
.cell-s.full { color: var(--ok); font-weight: 600; }
.cell-s.zero { color: var(--muted); }

/* Calculadora */
.calc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1080px) { .calc { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 12px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; font-weight: 700; color: var(--muted); }
.field input, .field select { font-family: var(--font-mono); }
.verdict { border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; background: var(--surface-2); }
.verdict.s-bad { background: var(--bad-soft); } .verdict.s-warn { background: var(--warn-soft); } .verdict.s-ok { background: var(--ok-soft); }
.vtitle { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.vtitle .dot { width: 12px; height: 12px; }
.vitem { display: grid; grid-template-columns: 9px 1fr; gap: 10px; align-items: baseline; font-size: 14px; font-weight: 500; }
/* Planilha expandida: some o trilho, o miolo ocupa a largura toda e a tabela vai até o fim da tela */
body.wide .app { grid-template-columns: 1fr; }
body.wide .rail, body.wide .mclients { display: none; }
body.wide main { max-width: none; padding-top: 14px; }
body.wide .sheet { max-height: calc(100vh - 220px); }
body.wide .mhead .ptitle h1 { font-size: 22px; }
/* Metas editáveis */
.tmeta input.cell, .tmeta select.cell { background: transparent; border-color: transparent; }
.tmeta input.cell:hover, .tmeta select.cell:hover { border-color: var(--line); }
.tmeta input.cell:focus, .tmeta select.cell:focus { background: var(--bg); border-color: var(--mint); outline: none; }
input.cell-txt, select.cell-txt { width: 100%; text-align: left; font-family: var(--font); }
.tmeta input.cell-nota { font-size: 12px; color: var(--muted); padding-top: 0; }
/* Roteiros */
.rotbtn { flex: none; margin: 6px 0 6px 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 800; color: var(--mint); white-space: nowrap; }
.rotbtn.tem { background: var(--ok-soft); border-color: transparent; color: var(--ok); }

      return o;
    };
    const fail = (error) => { if (error) throw { code: error.code === "42501" ? "invalid_argument" : "unavailable", message: error.message }; };
    async function upsert(col, id, data) {
      const d = clone(data); put(col, id, d);
      const { error } = await sb.from("nc_docs").upsert({ col, id, data: d }); fail(error);
    }
    const ready = (async () => {
      const { data, error } = await sb.from("nc_docs").select("col,id,data"); fail(error);
      (data || []).forEach((r) => { (cache[r.col] = cache[r.col] || {})[r.id] = r.data; });
      sb.channel("nc_docs").on("postgres_changes", { event: "*", schema: "public", table: "nc_docs" }, (p) => {
        if (p.eventType === "DELETE") put(p.old.col, p.old.id, null); else put(p.new.col, p.new.id, p.new.data);
      }).subscribe();
    })();
    const docApi = (col, id) => ({
      id,
      async get() { await ready; const d = (cache[col] || {})[id]; return { id, exists: !!d, data: () => d }; },
      async set(data) { await ready; await upsert(col, id, data); },
      async update(data) { await ready; const cur = (cache[col] || {})[id]; if (!cur) throw { code: "invalid_argument", message: "documento não existe" }; await upsert(col, id, merge(cur, data)); },
      async delete() { await ready; put(col, id, null); const { error } = await sb.from("nc_docs").delete().eq("col", col).eq("id", id); fail(error); },
      onSnapshot(cb, err) {
        const k = col + "/" + id; (docSubs[k] = docSubs[k] || []).push(cb);
        ready.then(() => { const d = (cache[col] || {})[id]; cb({ exists: !!d, data: () => d }); }, (e) => err && err(e));
        return () => { docSubs[k] = (docSubs[k] || []).filter((x) => x !== cb); };
      }
    });
    return {
      collection(col) {
        return {
          doc: (id) => docApi(col, id || "d" + Math.random().toString(36).slice(2, 12)),
          async add(data) { const id = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); await docApi(col, id).set(data); return { id }; },
          onSnapshot(cb, err) {
            (colSubs[col] = colSubs[col] || []).push(cb);
            ready.then(() => cb(snapDocs(col)), (e) => err && err(e));
            return () => { colSubs[col] = (colSubs[col] || []).filter((x) => x !== cb); };
          }
        };
      },
      doc(path) { const [col, id] = path.split("/"); return docApi(col, id); }
    };
  }
  async function entrar() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      const { data: adm } = await sb.from("nc_admins").select("email");
      if (adm && adm.length) return session;
      telaLogin("O e-mail " + session.user.email + " não tem acesso a este painel.", true);
      return null;
    }
    telaLogin("", false);
    return null;
  }
  function telaLogin(msg, logado) {
    const email = el("input", { id: "login-email", type: "email", placeholder: "seu e-mail", autocomplete: "email", value: (() => { try { return localStorage.getItem("nc-email") || ""; } catch (e) { return ""; } })() });
    const aviso = el("div", { class: "sugg", "aria-live": "polite" }, msg);
    const enviar = async (ev) => {
      ev.preventDefault();
      const e = email.value.trim(); if (!e) return;
      try { localStorage.setItem("nc-email", e); } catch (x) {}
      aviso.textContent = "Enviando…";
      const { error } = await sb.auth.signInWithOtp({ email: e, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } });
      aviso.textContent = error ? "Não deu para enviar: " + error.message : "Pronto! Abra o e-mail e clique no link para entrar. Pode fechar esta aba.";
    };
    $("#main").replaceChildren(el("form", { class: "panel login", onsubmit: enviar },
      el("h1", {}, "Entrar"),
      el("p", { class: "sugg" }, "Digite seu e-mail. Você recebe um link para entrar, sem senha."),
      email,
      el("button", { class: "btn primary", type: "submit" }, "Receber link de acesso"),
      logado ? el("button", { class: "linkbtn", type: "button", onclick: async () => { await sb.auth.signOut(); location.reload(); } }, "Sair desta conta") : null,
      aviso));
    $("#side").replaceChildren(); $("#mside").replaceChildren(); $("#areas").replaceChildren();
  }

  /* ---------- Áreas ---------- */
  function viewEstrategia() {
    const cli = state.cli; const fs = frentesDa("estrategia");
    const theme = state.cfg && state.cfg.temas ? el("div", { class: "theme" }, el("span", { class: "sugg" }, "Tema de " + (state.cfg.temasPeriodo || "agora") + ", pra tudo falar a mesma língua:"), el("b", {}, state.cfg.temas)) : null;
    if (!cli) return [theme, metaTable(""), overview(fs, "Estratégias do mês por cliente")];
    const mine = fs.filter((f) => inFrente(f, cli));
    return [theme, metaTable(cli),
      el("section", { class: "block" }, el("h2", {}, "Estratégia do mês"),
        mine.length ? el("div", { class: "steps" }, mine.map((f) => stepBlock(f, cli))) : el("div", { class: "empty" }, "Nenhuma estratégia ligada a este cliente ainda."),
        joinButtons(fs, cli))];
  }
  function viewTrafego() {
    const cli = state.cli; const fs = frentesDa("trafego");
    if (!cli) {
      const cards = state.clientes.filter((c) => c.ativo !== false).sort((a, b) => ORDER[sigWorst(a)] - ORDER[sigWorst(b)] || (a.ordem || 0) - (b.ordem || 0));
      return [pendList(""),
        el("section", { class: "block" }, el("h2", {}, "Rotina do dia"), cards.length ? el("div", { class: "grid" }, cards.map(card)) : el("div", { class: "empty" }, "A rotina das 8h30 ainda não gravou nenhuma rodada.")),
        overview(fs, "Andamento por cliente"), histTable("")];
    }
    const rot = state.clientes.filter((c) => rotinaOf(cli).includes(c.id) && c.ativo !== false);
    const mine = fs.filter((f) => inFrente(f, cli));
    return [pendList(cli),
      rot.length ? el("section", { class: "block" }, el("h2", {}, "Rotina do dia"), el("div", { class: "grid" }, rot.map(card)))
        : el("div", { class: "sugg" }, cliName(cli) + " ainda não está na rotina diária automática (falta confirmar conta e método de lead)."),
      el("section", { class: "block" }, el("h2", {}, "Etapas"), mine.filter((f) => f.ferramenta !== "calculadora").length ? el("div", { class: "steps" }, mine.filter((f) => f.ferramenta !== "calculadora").map((f) => stepBlock(f, cli))) : el("div", { class: "empty" }, "Nenhuma etapa de tráfego ligada a este cliente."), joinButtons(fs, cli)),
      el("section", { class: "block" }, el("h2", {}, "Otimização"), calcPanel(cli)),
      histTable(cli)];
  }
  function viewArea(aba) {
    const cli = state.cli; const fs = frentesDa(aba);
    if (!cli) return [overview(fs, "Andamento por cliente")];
    const mine = fs.filter((f) => inFrente(f, cli));
    return [el("section", { class: "block" },
      mine.length ? el("div", { class: "steps" }, mine.map((f) => stepBlock(f, cli))) : el("div", { class: "empty" }, (fs[0] && fs[0].vazio) || "Este cliente não está nesta área."),
      joinButtons(fs, cli))];
  }

  let raf = 0;
  function render() { clearTimeout(raf); raf = setTimeout(renderNow, 0); }
  function renderNow() {
    if (state.cli && state.cfg && !cfgClients().some((c) => c.slug === state.cli)) state.cli = "";
    renderNav(); renderSide(); renderGoal();
    const aba = state.aba; const titulo = (ABAS.find(([k]) => k === aba) || [])[1];
    const head = el("div", { class: "mhead" }, el("div", { class: "ptitle" }, el("span", { class: "crumb" }, state.cli ? cliName(state.cli) : "Visão geral · todos os clientes"), el("h1", {}, titulo)));
    const body = aba === "estrategia" ? viewEstrategia() : aba === "trafego" ? viewTrafego() : aba === "planilhas" ? viewPlanilhas() : aba === "links" ? viewLinks() : aba === "roteiros" ? viewRoteiros() : viewArea(aba);
    document.body.classList.toggle("wide", !!state.wide && aba === "planilhas" && !!state.cli);
    keepFocus(() => $("#main").replaceChildren(head, ...body.filter(Boolean)));
    document.querySelectorAll("textarea, input:not([type]), input[type=text]").forEach((e) => { e.spellcheck = true; e.lang = "pt-BR"; });
  }
  renderNav();
  if (window.matchMedia) { const mq = window.matchMedia("(max-width: 860px)"); if (mq.addEventListener) mq.addEventListener("change", renderNav); }

  (async () => {
    const sessao = await entrar(); if (!sessao) return;
    db = makeDb();
    $("#round").replaceChildren(el("span", {}, sessao.user.email), el("br"), el("button", { class: "linkbtn", type: "button", style: "color:var(--rail-muted);font-size:12px", onclick: async () => { await sb.auth.signOut(); location.reload(); } }, "Sair"));
    const onErr = (e) => { if (e && e.code !== "unavailable") fail(e); };
    const mapOf = (s) => { const m = {}; s.docs.forEach((d) => { m[d.id] = d.data(); }); return m; };
    const listOf = (s) => s.docs.map((d) => Object.assign({ id: d.id }, d.data()));
    db.doc("config/negocio").onSnapshot((s) => { state.cfg = s.exists ? s.data() : { clientes: [] }; render(); }, onErr);
    db.collection("clientes").onSnapshot((s) => { state.clientes = listOf(s); render(); }, onErr);
    db.collection("edicoes").onSnapshot((s) => { state.edicoes = mapOf(s); render(); }, onErr);
    db.collection("pendencias").onSnapshot((s) => { state.pend = listOf(s); render(); }, onErr);
    db.doc("rodadas/ultima").onSnapshot((s) => { state.ultima = s.exists ? s.data() : null; render(); }, onErr);
    db.collection("frentes").onSnapshot((s) => { state.frentes = listOf(s); render(); }, onErr);
    db.collection("progresso").onSnapshot((s) => { state.progresso = mapOf(s); render(); }, onErr);
    db.collection("metas").onSnapshot((s) => { state.metas = mapOf(s); if (!(document.activeElement && String(document.activeElement.id).startsWith("cm-"))) render(); }, onErr);
    db.collection("otimizacoes").onSnapshot((s) => { state.otim = listOf(s); render(); }, onErr);
    db.collection("metasnc").onSnapshot((s) => { state.metasNc = mapOf(s); render(); }, onErr);
    db.collection("planilhas").onSnapshot((s) => { state.planilhas = listOf(s); render(); }, onErr);
    db.collection("links").onSnapshot((s) => { state.links = mapOf(s); render(); }, onErr);
    db.collection("roteiros").onSnapshot((s) => { state.roteiros = listOf(s); render(); }, onErr);
    db.collection("pedidos").onSnapshot((s) => { state.pedidos = listOf(s); if (!(document.activeElement && String(document.activeElement.id).startsWith("ped-"))) render(); }, onErr);
    db.doc("config/dicionario").onSnapshot((s) => { state.dicio = s.exists ? s.data() : null; }, onErr);
  })();
})();
</script>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Looks da Grinda</title>
<link rel="icon" href="https://negocioscreators.com/marca/nc-icone-32.png">
<link rel="apple-touch-icon" href="https://negocioscreators.com/marca/nc-icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F3EBDF;--card:#FFFBF5;--ink:#3A261E;--muted:#7A6457;--line:#E2D5C3;--choc:#5A3A2E;--terra:#C8603A;--rosa:#E8558C;--rosa-claro:#FBE3EC;--ok:#2F7D4F;--ok-claro:#E1F1E6;--warn:#B7791F;--warn-claro:#FBF0D9;--rail-muted:#7A6457}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:15px;line-height:1.45;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
img{max-width:100%;display:block}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.marca{display:flex;align-items:baseline;gap:10px}
.marca h1{margin:0;font-family:"Playfair Display",serif;font-style:italic;font-size:28px;color:var(--rosa);letter-spacing:-.02em}
.marca span{color:var(--muted);font-size:13px}
#round{display:none}
.rail-sessao{font-size:12px;color:var(--muted);text-align:right}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--choc);border-color:var(--choc);color:#fff}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit}
.card img{aspect-ratio:4/5;object-fit:cover;width:100%}
.card .info{padding:12px 14px}
.card h3{margin:0 0 6px;font-size:16px}
.st{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.st-aguardando{background:var(--rosa-claro);color:#A3305E}.st-ajustes{background:var(--warn-claro);color:var(--warn)}
.st-aprovado{background:var(--ok-claro);color:var(--ok)}.st-agendado{background:#E3ECF8;color:#2C5A9A}.st-publicado{background:#EEE6DC;color:var(--choc)}
.vazio{color:var(--muted);padding:40px 0;text-align:center}
.voltar{background:none;border:0;color:var(--terra);font:inherit;font-weight:600;cursor:pointer;padding:0;margin-bottom:12px}
.topo-post{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.topo-post h2{margin:0;font-size:24px}
.slides{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}
.slide{flex:0 0 220px;scroll-snap-align:start;position:relative}
.slide img{width:220px;aspect-ratio:4/5;object-fit:cover;border-radius:10px;cursor:zoom-in;background:#ddd}
.slide .n{position:absolute;top:6px;left:6px;background:rgba(58,38,30,.8);color:#fff;border-radius:6px;font-size:12px;padding:1px 7px}
.slide button{margin-top:6px;width:100%}
.slide .marcado{outline:3px solid var(--warn);outline-offset:-3px}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}
@media(max-width:820px){.cols{grid-template-columns:1fr}.slide{flex-basis:70vw}.slide img{width:70vw}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.panel h3{margin:0 0 10px;font-size:16px}
textarea,input[type=datetime-local],input[type=email],input[type=password]{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
textarea{min-height:150px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--rosa);border-color:var(--rosa);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--warn-claro);border-color:#E9D29C;color:var(--warn)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.linkbtn{background:none;border:0;color:var(--terra);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
td a{color:var(--terra);word-break:break-all}
.sugg{color:var(--muted);font-size:13px;margin-top:8px}
.hist{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.login{max-width:420px;margin:40px auto;display:flex;flex-direction:column;gap:10px}
.senha-fundo{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(58,38,30,.55);padding:16px}
.zoom{position:fixed;inset:0;background:rgba(20,10,8,.88);display:grid;place-items:center;z-index:40;cursor:zoom-out;padding:16px}
.zoom img{max-height:92vh;border-radius:12px}
.comentario{background:var(--warn-claro);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="marca"><h1>Looks da Grinda</h1><span>aprovação de postagens · @luhcaper</span></div>
  <div><div id="round"></div></div>
</header>
<main id="main"><p class="vazio">Carregando…</p></main>
<div id="side" hidden></div><div id="mside" hidden></div><div id="areas" hidden></div>
<script>
const $ = (s) => document.querySelector(s);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v == null || v === false) return;
    if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v; else e.setAttribute(k, v === true ? "" : v);
  });
  kids.flat().forEach((k) => k != null && k !== false && e.append(k.nodeType ? k : document.createTextNode(String(k))));
  return e;
}
  /* ---------- Banco no Supabase (mesma interface do banco antigo do artifact) ---------- */
  const NC_URL = "https://ldwrkqlpigjnbulfxsbh.supabase.co";
  const NC_KEY = "sb_publishable_lY-olbrferdwg4fbm7op_w_9M5IymY1";
  const NC_VEIO_DO_LINK = /type=(magiclink|recovery|signup|invite)/.test(location.hash);  // entrou pelo link do e-mail: oferece criar senha
  const sb = window.supabase.createClient(NC_URL, NC_KEY, { auth: { persistSession: true, detectSessionInUrl: true, flowType: "implicit" } });
  function makeDb() {
    const cache = {};          // col -> { id -> data }
    const colSubs = {};        // col -> [cb]
    const docSubs = {};        // "col/id" -> [cb]
    const clone = (o) => JSON.parse(JSON.stringify(o));
    const snapDocs = (col) => ({ docs: Object.entries(cache[col] || {}).sort(([a], [b]) => a.localeCompare(b)).map(([id, d]) => ({ id, exists: true, data: () => d })) });
    const notify = (col, id) => {
      (colSubs[col] || []).forEach((cb) => cb(snapDocs(col)));
      const k = col + "/" + id, d = (cache[col] || {})[id];
      (docSubs[k] || []).forEach((cb) => cb({ exists: !!d, data: () => d }));
    };
    const put = (col, id, d) => { (cache[col] = cache[col] || {}); if (d === null) delete cache[col][id]; else cache[col][id] = d; notify(col, id); };
    const merge = (a, b) => {
      const o = Object.assign({}, a);
      Object.entries(b).forEach(([k, v]) => {
        if (v && typeof v === "object" && !Array.isArray(v) && o[k] && typeof o[k] === "object" && !Array.isArray(o[k])) o[k] = merge(o[k], v);
        else if (v === undefined) delete o[k]; else o[k] = v;
      });
      return o;
    };
    const fail = (error) => { if (error) throw { code: error.code === "42501" ? "invalid_argument" : "unavailable", message: error.message }; };
    async function upsert(col, id, data) {
      const d = clone(data); put(col, id, d);
      const { error } = await sb.from("nc_docs").upsert({ col, id, data: d }); fail(error);
    }
    const ready = (async () => {
      const { data, error } = await sb.from("nc_docs").select("col,id,data"); fail(error);
      (data || []).forEach((r) => { (cache[r.col] = cache[r.col] || {})[r.id] = r.data; });
      sb.channel("nc_docs").on("postgres_changes", { event: "*", schema: "public", table: "nc_docs" }, (p) => {
        if (p.eventType === "DELETE") put(p.old.col, p.old.id, null); else put(p.new.col, p.new.id, p.new.data);
      }).subscribe();
    })();
    const docApi = (col, id) => ({
      id,
      async get() { await ready; const d = (cache[col] || {})[id]; return { id, exists: !!d, data: () => d }; },
      async set(data) { await ready; await upsert(col, id, data); },
      async update(data) { await ready; const cur = (cache[col] || {})[id]; if (!cur) throw { code: "invalid_argument", message: "documento não existe" }; await upsert(col, id, merge(cur, data)); },
      async delete() { await ready; put(col, id, null); const { error } = await sb.from("nc_docs").delete().eq("col", col).eq("id", id); fail(error); },
      onSnapshot(cb, err) {
        const k = col + "/" + id; (docSubs[k] = docSubs[k] || []).push(cb);
        ready.then(() => { const d = (cache[col] || {})[id]; cb({ exists: !!d, data: () => d }); }, (e) => err && err(e));
        return () => { docSubs[k] = (docSubs[k] || []).filter((x) => x !== cb); };
      }
    });
    return {
      collection(col) {
        return {
          doc: (id) => docApi(col, id || "d" + Math.random().toString(36).slice(2, 12)),
          async add(data) { const id = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); await docApi(col, id).set(data); return { id }; },
          onSnapshot(cb, err) {
            (colSubs[col] = colSubs[col] || []).push(cb);
            ready.then(() => cb(snapDocs(col)), (e) => err && err(e));
            return () => { colSubs[col] = (colSubs[col] || []).filter((x) => x !== cb); };
          }
        };
      },
      doc(path) { const [col, id] = path.split("/"); return docApi(col, id); }
    };
  }
  async function entrar() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      const { data: adm } = await sb.from("nc_admins").select("email");
      if (adm && adm.length) return session;
      telaLogin("O e-mail " + session.user.email + " não tem acesso a este painel.", true);
      return null;
    }
    telaLogin("", false);
    return null;
  }
  function telaLogin(msg, logado) {
    const salvo = (() => { try { return localStorage.getItem("nc-email") || ""; } catch (e) { return ""; } })();
    const email = el("input", { id: "login-email", type: "email", placeholder: "seu e-mail", autocomplete: "username", value: salvo });
    const senha = el("input", { id: "login-senha", type: "password", placeholder: "sua senha", autocomplete: "current-password" });
    const aviso = el("div", { class: "sugg", "aria-live": "polite" }, msg);
    const entrarComSenha = async (ev) => {
      ev.preventDefault();
      const e = email.value.trim(); if (!e || !senha.value) { aviso.textContent = "Preencha o e-mail e a senha."; return; }
      try { localStorage.setItem("nc-email", e); } catch (x) {}
      aviso.textContent = "Entrando…";
      const { error } = await sb.auth.signInWithPassword({ email: e, password: senha.value });
      if (error) { aviso.textContent = /invalid/i.test(error.message) ? "E-mail ou senha não conferem. Se ainda não criou sua senha, use o link por e-mail abaixo." : "Não deu para entrar: " + error.message; return; }
      location.reload();
    };
    const mandarLink = async () => {
      const e = email.value.trim(); if (!e) { aviso.textContent = "Digite o seu e-mail primeiro."; return; }
      try { localStorage.setItem("nc-email", e); } catch (x) {}
      aviso.textContent = "Enviando…";
      const { error } = await sb.auth.signInWithOtp({ email: e, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } });
      aviso.textContent = error ? "Não deu para enviar: " + error.message : "Pronto! Abra o e-mail e clique no link. Ao entrar, crie a sua senha para não precisar mais do e-mail.";
    };
    $("#main").replaceChildren(el("form", { class: "panel login", onsubmit: entrarComSenha },
      el("h1", {}, "Entrar"),
      email, senha,
      el("button", { class: "btn primary", type: "submit" }, "Entrar"),
      el("button", { class: "linkbtn", type: "button", onclick: mandarLink }, "Primeira vez ou esqueceu a senha? Receber link por e-mail"),
      logado ? el("button", { class: "linkbtn", type: "button", onclick: async () => { await sb.auth.signOut(); location.reload(); } }, "Sair desta conta") : null,
      aviso));
    $("#side").replaceChildren(); $("#mside").replaceChildren(); $("#areas").replaceChildren();
  }
  function telaSenha(primeira) {
    const fundo = el("div", { class: "senha-fundo", role: "dialog", "aria-modal": "true", "aria-labelledby": "senha-t" });
    const s1 = el("input", { id: "senha-nova", type: "password", placeholder: "nova senha (mínimo 6 caracteres)", autocomplete: "new-password" });
    const s2 = el("input", { id: "senha-conf", type: "password", placeholder: "repita a senha", autocomplete: "new-password" });
    const aviso = el("div", { class: "sugg", "aria-live": "polite" });
    const fechar = () => fundo.remove();
    const salvar = async (ev) => {
      ev.preventDefault();
      if (s1.value.length < 6) { aviso.textContent = "A senha precisa ter pelo menos 6 caracteres."; return; }
      if (s1.value !== s2.value) { aviso.textContent = "As duas senhas não estão iguais."; return; }
      aviso.textContent = "Salvando…";
      const { error } = await sb.auth.updateUser({ password: s1.value });
      if (error) { aviso.textContent = "Não deu para salvar: " + error.message; return; }
      aviso.textContent = "Senha salva! Da próxima vez, entre com o e-mail e essa senha.";
      setTimeout(fechar, 1800);
    };
    fundo.append(el("form", { class: "panel login", onsubmit: salvar },
      el("h3", { id: "senha-t" }, primeira ? "Crie a sua senha" : "Trocar a senha"),
      el("p", { class: "sugg" }, primeira ? "Assim você entra em qualquer aparelho ou aba com e-mail e senha, sem esperar o link." : "Digite a nova senha duas vezes."),
      s1, s2,
      el("div", { style: "display:flex;gap:8px;flex-wrap:wrap" }, el("button", { class: "btn primary", type: "submit" }, "Salvar senha"), el("button", { class: "btn", type: "button", onclick: fechar }, primeira ? "Agora não" : "Cancelar")),
      aviso));
    document.body.append(fundo);
    setTimeout(() => s1.focus(), 50);
  }
  function rodapeSessao(sessao) {
    let box = document.getElementById("nc-sessao");
    if (!box) { box = el("div", { id: "nc-sessao", class: "rail-sessao" }); $("#round").after(box); }
    box.replaceChildren(el("span", {}, sessao.user.email), el("br"),
      el("button", { class: "linkbtn", type: "button", style: "color:var(--rail-muted);font-size:12px", onclick: () => telaSenha(false) }, "Senha"), " · ",
      el("button", { class: "linkbtn", type: "button", style: "color:var(--rail-muted);font-size:12px", onclick: async () => { await sb.auth.signOut(); location.reload(); } }, "Sair"));
    if (NC_VEIO_DO_LINK) setTimeout(() => telaSenha(true), 600);
  }


const STATUS = { aguardando: "Aguardando aprovação", ajustes: "Pedi ajustes", aprovado: "Aprovado", agendado: "Agendado", publicado: "Publicado" };
const ORDEM = ["aguardando", "ajustes", "aprovado", "agendado", "publicado"];
let db, posts = {}, filtro = "aguardando", aberto = null, email = "";
const fmt = (iso) => iso ? new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
const chip = (s) => el("span", { class: "st st-" + s }, STATUS[s] || s);

async function salvar(id, mudanca, acao) {
  const p = posts[id];
  const hist = (p.historico || []).concat(acao ? [{ quando: new Date().toISOString(), quem: email, acao }] : []);
  await db.collection("looks_posts").doc(id).set(Object.assign({}, p, mudanca, { historico: hist }));
}

function lista() {
  const todos = Object.entries(posts).sort(([, a], [, b]) => (b.criadoEm || "").localeCompare(a.criadoEm || ""));
  const cont = (s) => todos.filter(([, p]) => p.status === s).length;
  const vis = filtro === "todos" ? todos : todos.filter(([, p]) => p.status === filtro);
  $("#main").replaceChildren(
    el("div", { class: "filtros" },
      ...ORDEM.map((s) => el("button", { class: "chip" + (filtro === s ? " on" : ""), onclick: () => { filtro = s; lista(); } }, `${STATUS[s]} (${cont(s)})`)),
      el("button", { class: "chip" + (filtro === "todos" ? " on" : ""), onclick: () => { filtro = "todos"; lista(); } }, `Todos (${todos.length})`)),
    vis.length ? el("div", { class: "grade" }, ...vis.map(([id, p]) =>
      el("button", { class: "card", onclick: () => { aberto = id; detalhe(); } },
        el("img", { src: p.slides?.[0]?.src || "", alt: "capa de " + p.titulo, loading: "lazy" }),
        el("div", { class: "info" }, el("h3", {}, p.titulo), chip(p.status),
          el("div", { class: "sugg" }, `${p.slides?.length || 0} slides · comenta ${p.palavra || "—"}` + (p.agendarPara ? " · " + fmt(p.agendarPara) : ""))))))
      : el("p", { class: "vazio" }, filtro === "aguardando" ? "Nada esperando aprovação agora. ✨" : "Nenhum post aqui."));
}

function toast(t) { let b = document.getElementById("toast"); if (!b) { b = el("div", { id: "toast", role: "status", style: "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3A261E;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-size:14px" }); document.body.append(b); } b.textContent = t; b.hidden = false; clearTimeout(b._t); b._t = setTimeout(() => b.hidden = true, 3500); }
function zoom(src) { const z = el("div", { class: "zoom", onclick: () => z.remove() }, el("img", { src, alt: "slide ampliado" })); document.body.append(z); }

function detalhe() {
  const id = aberto, p = posts[id];
  if (!p) { aberto = null; return lista(); }
  const coments = p.comentarios || [];
  const porSlide = (i) => coments.filter((c) => c.slide === i + 1);
  const legenda = el("textarea", { "aria-label": "Legenda", value: p.legenda || "" });
  const quando = el("input", { type: "datetime-local", "aria-label": "Agendar para", value: (p.agendarPara || "").slice(0, 16) });
  const nota = el("textarea", { placeholder: "O que precisa mudar? (ex.: slide 4 a bolsa está errada; trocar a palavra da capa…)", style: "min-height:80px" });
  const aviso = { set textContent(v) { toast(v); } };
  const conf = p.conferencia || {};
  const comentarSlide = async (i) => {
    const t = prompt(`Ajuste no slide ${i + 1}:`);
    if (!t) return;
    await salvar(id, { comentarios: coments.concat([{ slide: i + 1, texto: t, quem: email, quando: new Date().toISOString() }]), status: "ajustes" }, `pediu ajuste no slide ${i + 1}`);
  };
  $("#main").replaceChildren(
    el("button", { class: "voltar", onclick: () => { aberto = null; lista(); } }, "← todos os posts"),
    el("div", { class: "topo-post" },
      el("div", {}, el("h2", {}, p.titulo), el("div", { class: "sugg" }, `${p.slides.length} slides · palavra do CTA: `, el("b", {}, p.palavra || "—"), p.referencia ? [" · ", el("a", { href: p.referencia, target: "_blank", rel: "noopener" }, "post de referência")] : "")),
      chip(p.status)),
    el("div", { class: "slides" }, ...p.slides.map((s, i) =>
      el("div", { class: "slide" },
        el("img", { src: s.src, alt: s.rotulo || `slide ${i + 1}`, loading: "lazy", class: porSlide(i).length ? "marcado" : "", onclick: () => zoom(s.src) }),
        el("span", { class: "n" }, i + 1),
        el("button", { class: "btn", onclick: () => comentarSlide(i) }, "Pedir ajuste"),
        ...porSlide(i).map((c) => el("div", { class: "comentario" }, c.texto))))),
    el("div", { class: "cols" },
      el("div", { class: "panel" },
        el("h3", {}, "Legenda"), legenda,
        el("div", { class: "acoes" },
          el("button", { class: "btn", onclick: async () => { await salvar(id, { legenda: legenda.value }, "editou a legenda"); aviso.textContent = "Legenda salva."; } }, "Salvar legenda"),
          el("button", { class: "btn", onclick: () => { navigator.clipboard.writeText(legenda.value); aviso.textContent = "Legenda copiada."; } }, "Copiar legenda")),
        el("h3", { style: "margin-top:18px" }, "Aprovação"),
        el("label", { class: "sugg" }, "Data e hora pra postar (opcional)"), quando,
        nota,
        el("div", { class: "acoes" },
          el("button", { class: "btn ok", onclick: async () => {
            await salvar(id, { status: "aprovado", aprovadoEm: new Date().toISOString(), agendarPara: quando.value || p.agendarPara || "", legenda: legenda.value }, "aprovou" + (quando.value ? " pra " + fmt(quando.value) : ""));
            aviso.textContent = "Aprovado! O Claude agenda quando você pedir."; } }, "✓ Aprovar"),
          el("button", { class: "btn warn", onclick: async () => {
            if (!nota.value.trim()) { aviso.textContent = "Escreva o que precisa mudar."; nota.focus(); return; }
            await salvar(id, { status: "ajustes", comentarios: coments.concat([{ slide: 0, texto: nota.value.trim(), quem: email, quando: new Date().toISOString() }]) }, "pediu ajustes");
            aviso.textContent = "Ajuste registrado. É só pedir pro Claude: \"faz os ajustes dos looks\"."; } }, "Pedir ajustes"),
          p.status === "aprovado" || p.status === "agendado" ? el("button", { class: "btn", onclick: () => salvar(id, { status: "publicado", publicadoEm: new Date().toISOString() }, "marcou como publicado") }, "Marcar publicado") : null),
        coments.filter((c) => !c.slide).map((c) => el("div", { class: "comentario" }, `${fmt(c.quando)} — ${c.texto}`))),
      el("div", { class: "panel" },
        el("h3", {}, "Links de afiliada"),
        el("div", { class: "sugg", style: "margin:0 0 8px" }, conf.ok ? `✅ Conferidos ${fmt(conf.em)}: todos são da sua afiliação (Shopee ${conf.shopee || ""} · Shein ${conf.shein || ""}).` : "⚠️ Conferência ainda não feita."),
        el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "Nº"), el("th", {}, "Peça"), el("th", {}, "Loja"), el("th", {}, "Link"))),
          el("tbody", {}, ...(p.links || []).map((l) => el("tr", {}, el("td", {}, l.num), el("td", {}, l.peca, l.obs ? el("div", { class: "sugg" }, l.obs) : ""), el("td", {}, l.loja),
            el("td", {}, ...l.urls.map((u) => el("div", {}, el("a", { href: u, target: "_blank", rel: "noopener" }, u)))))))),
        el("div", { class: "acoes" }, el("button", { class: "btn primary", onclick: () => { navigator.clipboard.writeText(p.mensagem || ""); aviso.textContent = "Mensagem de links copiada."; } }, "Copiar mensagem de links")),
        el("h3", { style: "margin-top:18px" }, "Histórico"),
        el("ul", { class: "hist" }, ...(p.historico || []).slice().reverse().map((h) => el("li", {}, `${fmt(h.quando)} · ${h.acao}`))))));
}

(async () => {
  const sessao = await entrar(); if (!sessao) return;
  email = sessao.user.email;
  db = makeDb();
  rodapeSessao(sessao);
  db.collection("looks_posts").onSnapshot((snap) => {
    posts = {}; snap.docs.forEach((d) => { posts[d.id] = d.data(); });
    aberto ? detalhe() : lista();
  }, (e) => { $("#main").replaceChildren(el("p", { class: "vazio" }, "Não deu pra carregar: " + (e.message || e))); });
})();
</script>
